name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check repository safety boundary
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_repository_safety.py

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build loom
        run: go build ./cmd/loom

  race:
    name: Race detector (CGO and GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm C compiler
        run: |
          test "$(go env CGO_ENABLED)" = "1"
          gcc --version

      - name: Test with race detector
        run: go test -race ./...

  windows:
    name: Windows client native checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Win32 message pointers retain the documented unsafe.Pointer vet baseline.
      # Real QR/TUN/MSI acceptance remains explicitly opt-in on a Windows host.
      - name: Native client tests
        run: go test -vet=off ./clients/windows ./internal/clientruntime ./internal/clientsecret ./internal/clientjoin ./internal/clientreport
      - name: Vet client packages
        run: go vet -unsafeptr=false ./clients/windows ./internal/clientruntime ./internal/clientsecret ./internal/clientjoin ./internal/clientreport
      - name: Compile ARM64 host
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go test -c -vet=off -o client-arm64.test.exe ./clients/windows

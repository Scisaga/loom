name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test, vet, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check repository safety boundary
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/check_repository_safety.py

      - name: Test
        # Linux execution inputs require root ownership. Real data-plane
        # acceptance remains opt-in; native TUN activation isolates itself.
        # A short root-owned path keeps Unix sockets and child user
        # namespaces independent of the runner's private home directory.
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${LOOM_LINUX_MIXED_EXECUTABLE:-}${LOOM_TUN_ROUTING_EXECUTABLE:-}"
          sudo mkdir -m 0700 /ci
          test "$(sudo stat -c '%u:%g:%a' /ci)" = 0:0:700
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            TMPDIR=/ci go test ./...

      - name: Vet
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go vet ./...

      - name: Build loom
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" go build ./cmd/loom

  race:
    name: Race detector (CGO and GCC)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CGO_ENABLED: "1"
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Confirm C compiler
        run: |
          test "$(go env CGO_ENABLED)" = "1"
          gcc --version

      - name: Test with race detector
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test -z "${LOOM_LINUX_MIXED_EXECUTABLE:-}${LOOM_TUN_ROUTING_EXECUTABLE:-}"
          sudo mkdir -m 0700 /ci
          test "$(sudo stat -c '%u:%g:%a' /ci)" = 0:0:700
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            TMPDIR=/ci CGO_ENABLED=1 CC=gcc go test -race ./...

  native-dataplane:
    name: Native data plane (pinned sources, race, Linux amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CC: gcc
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test and build pinned native data plane
        run: python3 scripts/test-native-dataplane.py

      - name: Add native test summary
        if: always()
        shell: bash
        run: |
          for summary in out/native-dataplane-tests/run-*/summary.md; do
            if [[ -f "$summary" ]]; then
              cat "$summary" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Retain native test logs and source provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-dataplane-test-logs
          path: |
            out/native-dataplane-tests/run-*/logs/
            out/native-dataplane-tests/run-*/summary.json
            out/native-dataplane-tests/run-*/summary.md
            out/native-dataplane-tests/run-*/source-provenance.json
          if-no-files-found: warn
          retention-days: 14

  windows:
    name: Windows client native checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # Win32 message pointers retain the documented unsafe.Pointer vet baseline.
      # Real QR/TUN/MSI acceptance remains explicitly opt-in on a Windows host.
      - name: Native client tests
        run: go test -vet=off ./clients/windows ./internal/clientadapter ./internal/clientmodel ./internal/clientruntime ./internal/clientsecret ./internal/clientjoin ./internal/deviceclient
      - name: Vet client packages
        run: go vet -unsafeptr=false ./clients/windows ./internal/clientadapter ./internal/clientmodel ./internal/clientruntime ./internal/clientsecret ./internal/clientjoin ./internal/deviceclient
      - name: Compile ARM64 host
        shell: pwsh
        run: |
          $env:GOARCH = 'arm64'
          go test -c -vet=off -o client-arm64.test.exe ./clients/windows

name: Windows build
run-name: Windows ${{ inputs.version }} preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: MSI version (major.minor.build)
        required: true
        default: '0.1.6'
        type: string

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  zip:
    name: Build Windows ZIPs
    needs: checks
    # GitHub requires push access to read unpublished release assets.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BUILD_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate build inputs
        env:
          PLATFORM_PUBLIC_KEY: ${{ vars.LOOM_PLATFORM_PUBLIC_KEY }}
        run: |
          python3 - <<'PY'
          import base64, binascii, os, re
          from pathlib import Path
          version = os.environ['BUILD_VERSION']
          if not re.fullmatch(r'(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,2})\.(0|[1-9][0-9]{0,4})', version):
              raise SystemExit('Version must be major.minor.build without leading zeroes.')
          if any(value > limit for value, limit in zip(map(int, version.split('.')), (255, 255, 65535))):
              raise SystemExit('Version exceeds Windows Installer limits.')
          key = os.environ['PLATFORM_PUBLIC_KEY'].strip()
          try:
              decoded = base64.b64decode(key, validate=True)
          except binascii.Error:
              decoded = b''
          if len(decoded) != 32 or base64.b64encode(decoded).decode() != key:
              raise SystemExit('Configure LOOM_PLATFORM_PUBLIC_KEY with the trusted Ed25519 public key.')
          temp = Path(os.environ['RUNNER_TEMP'])
          public_key = temp / 'platform-signing.pub'
          public_key.write_text(key + '\n')
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('PLATFORM_SIGNING_PUB=' + str(public_key) + '\n')
              output.write('LOOM_WINDOWS_COMPONENT_DIR=' + str(temp / 'windows-components') + '\n')
          PY
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # §10.2: reuse platform-signed upstream packages; CI holds no platform private key.
      - name: Download signed component packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$LOOM_WINDOWS_COMPONENT_DIR"
          gh release download windows-components-1.11.4 \
            --pattern 'loom-windows-dataplane-1.11.4-amd64.zip' \
            --pattern 'loom-windows-dataplane-1.11.4-arm64.zip' \
            --dir "$LOOM_WINDOWS_COMPONENT_DIR"
      - name: Build all six ZIPs
        run: |
          go mod download
          bash ./scripts/build-windows-clients.sh
          (cd out && sha256sum --check windows-clients-SHA256SUMS)
      - name: Record build source
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path('out/BUILD-INFO.txt').write_text(
              'Unsigned Windows preview\n'
              + 'MSI version: ' + os.environ['BUILD_VERSION'] + '\n'
              + 'Commit: ' + os.environ['GITHUB_SHA'] + '\n'
              + 'Run: ' + os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GITHUB_REPOSITORY']
              + '/actions/runs/' + os.environ['GITHUB_RUN_ID'] + '\n'
          )
          PY
      - name: Upload ZIP build inputs for MSI
        uses: actions/upload-artifact@v4
        with:
          name: windows-zips-${{ inputs.version }}
          path: |
            out/loom-client-windows-*.zip
            out/windows-clients-SHA256SUMS
            out/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  msi:
    name: Build Windows installers
    needs: zip
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      BUILD_VERSION: ${{ inputs.version }}
      DOTNET_ROLL_FORWARD: Major
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download verified ZIP build
        uses: actions/download-artifact@v4
        with:
          name: windows-zips-${{ inputs.version }}
          path: out
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX
        shell: pwsh
        run: dotnet tool install --tool-path "$env:RUNNER_TEMP\wix" wix --version 5.0.2
      - name: Build both MSI installers
        shell: pwsh
        run: ./scripts/build-windows-installers.ps1 -Version $env:BUILD_VERSION -Wix "$env:RUNNER_TEMP\wix\wix.exe"
      - name: Upload complete Windows preview
        uses: actions/upload-artifact@v4
        with:
          name: loom-windows-${{ inputs.version }}-preview
          path: |
            out/loom-client-windows-*.zip
            out/loom-client-windows-installed-*.msi
            out/windows-clients-SHA256SUMS
            out/windows-installers-SHA256SUMS
            out/BUILD-INFO.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish Windows preview release
    needs: msi
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BUILD_VERSION: ${{ inputs.version }}
      RELEASE_TAG: windows-v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download complete Windows preview
        uses: actions/download-artifact@v4
        with:
          name: loom-windows-${{ inputs.version }}-preview
          path: out
      - name: Verify release files and prepare notes
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          output = Path('out')
          packages = {
              'windows-clients-SHA256SUMS': {
                  f'loom-client-windows-{edition}-{arch}.zip'
                  for edition in ('installed', 'portable-mixed', 'portable-tun')
                  for arch in ('amd64', 'arm64')
              },
              'windows-installers-SHA256SUMS': {
                  f'loom-client-windows-installed-{arch}.msi' for arch in ('amd64', 'arm64')
              },
          }
          expected = {'BUILD-INFO.txt', *packages, *set.union(*packages.values())}
          if {path.name for path in output.iterdir()} != expected:
              raise SystemExit('Release must contain all six ZIPs, two MSIs, checksums and build info.')
          for manifest, names in packages.items():
              entries = [line.split() for line in (output / manifest).read_text().splitlines()]
              if len(entries) != len(names) or any(len(entry) != 2 for entry in entries):
                  raise SystemExit(f'Invalid checksum manifest: {manifest}')
              if {name for _, name in entries} != names:
                  raise SystemExit(f'Incomplete checksum manifest: {manifest}')
              for digest, name in entries:
                  if hashlib.sha256((output / name).read_bytes()).hexdigest() != digest:
                      raise SystemExit(f'Checksum mismatch: {name}')
          version, sha = os.environ['BUILD_VERSION'], os.environ['GITHUB_SHA']
          repo_url = os.environ['GITHUB_SERVER_URL'] + '/' + os.environ['GH_REPO']
          run_url = repo_url + '/actions/runs/' + os.environ['GITHUB_RUN_ID']
          info = (output / 'BUILD-INFO.txt').read_text().splitlines()
          if not {f'MSI version: {version}', f'Commit: {sha}', f'Run: {run_url}'}.issubset(info):
              raise SystemExit('Build info does not match this workflow run.')
          Path(os.environ['RUNNER_TEMP'], 'release-notes.md').write_text(
              'Windows 客户端预览版，EXE 和 MSI 尚未进行 Authenticode 签名。\n\n'
              '- 安装使用：选择 `installed-amd64.msi`；Windows on ARM 选择 `installed-arm64.msi`。\n'
              '- 免安装使用：选择 `portable-mixed`（代理）或 `portable-tun` ZIP，解压后运行 EXE。\n'
              '- 加入网络需要管理员提供与客户端内置平台公钥匹配的加入码。\n'
              '- SHA-256 校验值和构建来源见随附清单及 `BUILD-INFO.txt`。\n\n'
              f'[使用说明]({repo_url}/blob/{sha}/clients/windows/README.md) · '
              f'[Code signing policy]({repo_url}/blob/{sha}/docs/code-signing-policy.md)\n\n'
              f'源码：[{sha[:7]}]({repo_url}/commit/{sha}) · [GitHub Actions 构建]({run_url})\n'
          )
          PY
      - name: Publish complete prerelease
        run: |
          refs=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG")
          count=$(jq --arg ref "refs/tags/$RELEASE_TAG" '[.[] | select(.ref == $ref)] | length' <<< "$refs")
          if [ "$count" != 0 ]; then
            echo 'This version tag already exists. Choose a new version.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" out/* \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "Loom Windows $BUILD_VERSION preview (unsigned)" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          gh release view "$RELEASE_TAG" --json url --jq .url >> "$GITHUB_STEP_SUMMARY"

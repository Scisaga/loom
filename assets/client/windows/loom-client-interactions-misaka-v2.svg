<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="780" viewBox="0 0 1140 780" role="img" aria-labelledby="title description">
  <title id="title">Loom Windows client interactions — Misaka v2</title>
  <desc id="description">Flat content views for inline rename, a right-side invitation form, and an animated connection summary; no nested panels, modal frame or upload dropzone.</desc>
  <!-- Original Windows favicon and large brand asset are embedded byte-for-byte; no recoloring. -->
  <defs>
    <symbol id="brand-favicon" viewBox="0 0 32 32">
      <image href="data:image/svg+xml;base64," width="32" height="32"/>
    </symbol>
    <symbol id="brand-large" viewBox="0 0 64 64">
      <image href="data:image/svg+xml;base64," width="64" height="64"/>
    </symbol>
    <symbol id="pc" viewBox="0 0 24 24">
      <rect x="3" y="4" width="18" height="12" rx="2"/>
      <path d="M8 21h8m-4-5v5"/>
    </symbol>
    <symbol id="server" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="7" rx="2"/>
      <rect x="4" y="14" width="16" height="7" rx="2"/>
      <path d="M8 6.5h.01M8 17.5h.01m4-11h4m-4 11h4"/>
    </symbol>
    <symbol id="target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M3 12h18m-9-9c5 5 5 13 0 18m0-18c-5 5-5 13 0 18"/>
    </symbol>
    <symbol id="check" viewBox="0 0 24 24">
      <path d="m5 12 5 5L20 7"/>
    </symbol>
    <symbol id="plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="arrow" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
    <symbol id="power" viewBox="0 0 24 24">
      <path d="M12 3v9M7 5.5a8 8 0 1 0 10 0"/>
    </symbol>
    <symbol id="file" viewBox="0 0 24 24">
      <path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/>
    </symbol>
    <style><![CDATA[
    .ui {font-family:"Segoe UI","Microsoft YaHei UI",sans-serif;fill:#181B1A;font-size:13px}
    .muted {fill:#747D77} .green {fill:#239B68} .blue {fill:#3979C5} .white {fill:#FFF}
    .title {font-size:23px;font-weight:650} .section {font-size:15px;font-weight:600}
    .body {font-size:13px} .small {font-size:12px} .tiny {font-size:11px}
    .mono {font-family:Consolas,"Microsoft YaHei UI",monospace} .medium {font-weight:600}
    .icon {fill:none;stroke:#737976;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    .icon-green {fill:none;stroke:#239B68;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
    .card {fill:#FFF;stroke:#E4E7E5} .rule {stroke:#E6E9E7;stroke-width:1}
  ]]></style>
  </defs>
  <g class="ui">
    <rect x="0" y="0" width="1140" height="780" rx="0" fill="#FCFCFB"/>
    <text x="32" y="35" class="section">重命名 · 原位置编辑</text>
    <text x="391" y="35" class="section">添加 · 直接使用右侧内容区</text>
    <path d="M358 65L358 524" stroke="#E6E9E7" stroke-width="1"/>
    <path d="M32 548H1108" stroke="#E6E9E7" stroke-width="1"/>
    <text x="32" y="92" class="small medium muted">连接配置</text>
    <use href="#plus" x="299" y="77" width="20" height="20" class="icon"/>
    <rect x="20" y="116" width="304" height="58" rx="5" fill="#E9F3ED"/>
    <circle cx="36" cy="138" r="4" fill="#239B68"/>
    <rect x="50" y="125" width="260" height="28" rx="3" fill="#FFF" stroke="#239B68"/>
    <text x="61" y="145" class="body medium">demo-work</text>
    <path d="M138 129L138 149" stroke="#239B68" stroke-width="1"/>
    <text x="36" y="166" class="tiny green">已连接</text>
    <circle cx="36" cy="206" r="4" fill="#AAB2AC"/>
    <text x="50" y="211" class="body">demo-personal</text>
    <text x="36" y="235" class="tiny muted">未连接</text>
    <text x="32" y="298" class="small">双击名称或按 F2 开始编辑</text>
    <text x="32" y="328" class="small medium">Enter 保存 · Esc 取消</text>
    <text x="32" y="358" class="small muted">只修改本地名称，连接继续运行</text>
    <text x="32" y="495" class="tiny muted">行内输入框是唯一新增的边框。</text>
    <text x="391" y="93" class="title">添加连接配置</text>
    <text x="391" y="118" class="small muted">使用中控提供的加入邀请</text>
    <text x="391" y="158" class="small medium">配置名称</text>
    <rect x="391" y="171" width="690" height="34" rx="4" fill="#FFF" stroke="#D8DDD9"/>
    <text x="403" y="194" class="body">demo-new</text>
    <text x="391" y="244" class="small medium">加入邀请</text>
    <text x="391" y="269" class="small muted">选择二维码 PNG 或 .loom-invite 文件，也可粘贴二维码。</text>
    <rect x="391" y="289" width="136" height="34" rx="6" fill="#FFF" stroke="#D8DDD9"/>
    <text x="459.0" y="311" class="small medium" text-anchor="middle">选择邀请文件</text>
    <rect x="539" y="289" width="128" height="34" rx="6" fill="#FFF" stroke="#D8DDD9"/>
    <text x="603.0" y="311" class="small medium" text-anchor="middle">粘贴二维码</text>
    <use href="#check" x="391" y="343" width="19" height="19" class="icon-green"/>
    <text x="419" y="357" class="small green">demo-invite.loom-invite · 已选择</text>
    <rect x="391" y="404" width="124" height="34" rx="6" fill="#239B68"/>
    <text x="453.0" y="426" class="small medium white" text-anchor="middle">加入并保存</text>
    <rect x="527" y="404" width="88" height="34" rx="6" fill="#FFF" stroke="#D8DDD9"/>
    <text x="571.0" y="426" class="small medium" text-anchor="middle">取消</text>
    <text x="391" y="470" class="small muted">加入成功后保持未连接，点击“连接”才接管流量。</text>
    <text x="391" y="495" class="small muted">添加期间保留左侧列表；当前连接继续运行。</text>
    <text x="32" y="582" class="section">连接中 · 更新原连接摘要</text>
    <text x="32" y="620" class="title">demo-new</text>
    <circle cx="56" cy="666" r="21" fill="#EDF3FC"/>
    <circle cx="56" cy="666" r="11" fill="none" stroke="#D6E4F6" stroke-width="2"/>
    <path d="M56 655a11 11 0 0 1 11 11" fill="none" stroke="#3979C5" stroke-width="2.2" stroke-linecap="round"/>
    <text x="94" y="664" class="title">正在连接</text>
    <text x="94" y="691" class="small muted">正在验证并启动本地数据面…</text>
    <rect x="969" y="647" width="139" height="34" rx="6" fill="#FFF" stroke="#D8DDD9"/>
    <text x="1038.5" y="669" class="small medium" text-anchor="middle">取消连接</text>
    <text x="32" y="737" class="small muted">连接完成后显示实际路径；进度仅刷新图标区域。</text>
    <text x="1108" y="768" class="tiny muted" text-anchor="end">交互原型 · demo-* 为示意；所有边框仅用于实际可编辑控件。</text>
  </g>
</svg>

<title id="title">Loom Windows client — join-draft</title>
<desc id="desc">Windows 客户端 join-draft 可编辑矢量原型；内容位置与 876×614 DIP、96 DPI 的生产 Win32 WM_PRINT 基准场景对齐。外框的 10 DIP 圆角是目标自定义窗体差异，尚须用 96、144、192 DPI 的 DWM 合成截图回读。示例数据并非实时连接或健康事实。</desc>

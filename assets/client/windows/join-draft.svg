">添加连接配置</text><text x="196" y="98" class="small muted">保存后保持断开，现有连接继续运行。</text><rect x="196" y="114" width="660" height="330" rx="8" fill="#fff" stroke="#d7deda" stroke-width="1" /><text x="220" y="149" class="small muted">配置名称</text><rect x="220" y="161" width="612" height="35" rx="5" fill="#fff" stroke="#d5ddd8" stroke-width="1" /><text x="226" y="183">demo-unsaved-input</text><text x="220" y="233" class="small muted">加入邀请</text><text x="220" y="254" class="small muted">二维码 PNG 或 .loom-invite 文件，也可从剪贴板粘贴。</text><g id="button-220-268"><rect x="220" y="268" width="144" height="34" rx="6" fill="#fff" stroke="#d5ddd8" stroke-width="1" /><text x="292.0" y="289.0" text-anchor="middle" font-size="12" fill="#161c18">选择邀请文件</text></g><g id="button-376-268"><rect x="376" y="268" width="144" height="34" rx="6" fill="#fff" stroke="#d5ddd8" stroke-width="1" /><text x="448.0" y="289.0" text-anchor="middle" font-size="12" fill="#161c18">粘贴二维码</text></g><text x="220" y="329" class="small muted">导入中控提供的加入二维码后，才会保存连接配置。</text><g id="button-610-387"><rect x="610" y="387" width="85" height="33" rx="6" fill="#fff" stroke="#d5ddd8" stroke-width="1" /><text x="652.5" y="407.5" text-anchor="middle" font-size="12" fill="#161c18">取消</text></g><g id="button-708-387"><rect x="708" y="387" width="124" height="33" rx="6" fill="#f0f2f1" /><text x="770.0" y="407.5" text-anchor="middle" font-size="12" fill="#a0aaa5">加入并保存</text></g></g></g>

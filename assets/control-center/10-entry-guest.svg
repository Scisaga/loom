  <text class="ui body mono muted" x="353" y="257" text-anchor="start">https://control.loom/</text>
  <text class="ui body" x="353" y="302" text-anchor="start">Install your admin certificate to open the control center.</text>
  <line class="rule" x1="353" y1="337" x2="1233" y2="337"/>
  <text class="ui section muted" x="353" y="384" text-anchor="start">1</text>
  <text class="ui section" x="392" y="383" text-anchor="start">Receive the admin package</text>
  <text class="ui body muted" x="392" y="414" text-anchor="start">Control creates admin.p12 and a separate password file.</text>
  <text class="ui body muted" x="392" y="441" text-anchor="start">Retrieve them through the protected operator channel.</text>
  <text class="ui section muted" x="353" y="497" text-anchor="start">2</text>
  <text class="ui section" x="392" y="496" text-anchor="start">Import the certificate into your browser</text>
  <text class="ui body muted" x="392" y="528" text-anchor="start">Select the admin certificate when prompted, then reload this private address.</text>

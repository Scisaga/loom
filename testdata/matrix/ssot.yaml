# 参考 SSOT。所有 IP 取自 RFC 5737 文档保留段,域名取自 RFC 2606,
# 不指向任何真实主机。
#
# 这份 fixture 刻意覆盖:
#   - 两种 direction 组合(bi↔rev)
#   - 能进 mesh 的服务器不出现在 tunnels 里(§6.3、D13)
#   - 两个选择轴的三种组合(§4)
#   - l4_direct 与 l7_gateway 两种承载(§4.4)

# 组件版本是期望态的一部分,与配置并入同一条收敛回路(§15.4)。
# 永不使用 latest —— 自动的是下载,不是升级决策。
defaults:
  dns: [223.5.5.5, 119.29.29.29]   # 必须显式配 —— 系统解析器坏掉时只有
                                   # 直连候选会失败,极难诊断(§7.4)
  components:
    sing_box: 1.11.4
    wireguard: 1.0.20250521
    agent: 0.1.0

nodes:
  # ---- 国内云机。有公网 IP,能被主动连,因此能进 mesh(§8.3)----
  #      它们之间不需要任何隧道条目 —— Headscale 自动分发密钥。
  - id: cn-bj
    city: 北京
    public_endpoint: 203.0.113.10
    components:
      sing_box: 1.11.5      # 这台先行验证新版(§15.4 分批推进)
    server:
      direction: bidirectional
      inbound_port: 443
      egress_capable: true
      wg_public_key: Y24tYmotdGVzdC1rZXkAAAAAAAAAAAAAAAAAAAAAAAA=
      secret_generation: 3

  - id: cn-sh
    city: 上海
    public_endpoint: 203.0.113.11
    server:
      direction: bidirectional
      inbound_port: 443
      egress_capable: true
      wg_public_key: Y24tc2gtdGVzdC1rZXkAAAAAAAAAAAAAAAAAAAAAAAA=

  - id: cn-gz
    city: 广州
    public_endpoint: 203.0.113.12
    server:
      direction: bidirectional
      inbound_port: 443
      egress_capable: true
      wg_public_key: Y24tZ3otdGVzdC1rZXkAAAAAAAAAAAAAAAAAAAAAAAA=

  - id: cn-cd
    city: 成都
    public_endpoint: 203.0.113.13
    server:
      direction: bidirectional
      inbound_port: 443
      egress_capable: true
      wg_public_key: Y24tY2QtdGVzdC1rZXkAAAAAAAAAAAAAAAAAAAAAAAA=

  # ---- 境外 VPS。被主动拨号会提高被封概率,所以只能它主动连出来。----
  #      进不了 mesh(§2.2),因此需要手工建隧道矩阵(§6.3)。
  #      它也拨不到,所以永远不能是链上第一跳 —— 只能由国内云机推给它。
  - id: sg-vps
    city: 新加坡
    public_endpoint: 198.51.100.20
    server:
      direction: reverse_only
      inbound_port: 443
      egress_capable: true
      wg_public_key: c2ctdnBzLXRlc3Qta2V5AAAAAAAAAAAAAAAAAAAAAAA=

  - id: jp-vps
    city: 东京
    public_endpoint: 198.51.100.21
    server:
      direction: reverse_only
      inbound_port: 443
      egress_capable: true
      wg_public_key: anAtdnBzLXRlc3Qta2V5AAAAAAAAAAAAAAAAAAAAAAA=

  # ---- 接入节点。它们是节点,不是另起一张表的"客户端档案"(§1)。----
  - id: phone
    name: Pixel
    access:
      platform: android          # 绝大多数 App 不能单独设代理,只能走 TUN(§7.2)
      credentials: [cred-phone]

  - id: workstation
    name: 开发机
    access:
      platform: desktop          # TUN 兜底 + mixed 精确控制
      credentials: [cred-ws-sg, cred-ws-eg, cred-ws-llm, cred-ws-3p]
      default_declaration: best-egress
      mixed_ports:
        - {port: 1080, declaration: sg-fixed}
        - {port: 1081, declaration: best-egress}
        - {port: 1082, declaration: llm-ttft}
        - {port: 1083, declaration: llm-3p}

  - id: ci-runner
    name: CI 构建机
    access:
      platform: linux-server     # 只用 mixed,不开 TUN(§7.2)
      credentials: [cred-ci]
      mixed_ports:
        - {port: 1080, declaration: best-egress}

# 隧道只覆盖 reverse_only 的服务器(§6.3、D13)。
# 国内云机之间一条都没有 —— 那是 Headscale 的活。
tunnels:
  # 每台境外 VPS 向所有国内云机扇出反连,避免绕行(§6.3)。
  # 端口从保留范围 61610-61699 里挑,刻意不连号 —— 连号本身是个特征。
  - {from: cn-bj, to: sg-vps, listen_port: 61637, from_addr: 10.99.0.1/32, to_addr: 10.99.0.2/32}
  - {from: cn-sh, to: sg-vps, listen_port: 61619, from_addr: 10.99.0.3/32, to_addr: 10.99.0.4/32}
  - {from: cn-gz, to: sg-vps, listen_port: 61673, from_addr: 10.99.0.5/32, to_addr: 10.99.0.6/32}
  - {from: cn-cd, to: sg-vps, listen_port: 61645, from_addr: 10.99.0.7/32, to_addr: 10.99.0.8/32}
  - {from: cn-bj, to: jp-vps, listen_port: 61682, from_addr: 10.99.1.1/32, to_addr: 10.99.1.2/32}
  - {from: cn-sh, to: jp-vps, listen_port: 61654, from_addr: 10.99.1.3/32, to_addr: 10.99.1.4/32}
  - {from: cn-gz, to: jp-vps, listen_port: 61628, from_addr: 10.99.1.5/32, to_addr: 10.99.1.6/32}
  - {from: cn-cd, to: jp-vps, listen_port: 61691, from_addr: 10.99.1.7/32, to_addr: 10.99.1.8/32}

# ---------------------------------------------------------------------------
# 目标地址(§9)。它们不是节点,只活在等价类里。
# ---------------------------------------------------------------------------

equivalence_classes:
  # 自建推理服务的多机房部署。三个地址共用同一域名、同一 CA、同一套凭据,
  # 所以契约同构,可以由 L4 直接换(§4.4)。客户端始终请求 llm.internal,
  # 换的只是它解析到哪个地址;TLS SNI 与证书因此仍然有效。
  - id: llm:qwen3-32b-int8@openai-v1
    output_contract: OpenAI v1 chat/completions,32k 上下文,支持流式
    carrier: l4_direct
    observation_point: endpoint
    price_source: 自建,按机时折算
    members:
      - address: https://192.0.2.10:8443/v1
        region: 华东
        access_contract: {domain: llm.internal, cert_ca: loom-internal-ca, credential: "vault:llm/shared", protocol_ver: h2}
      - address: https://192.0.2.11:8443/v1
        region: 华南
        access_contract: {domain: llm.internal, cert_ca: loom-internal-ca, credential: "vault:llm/shared", protocol_ver: h2}

  # 第三方 API。域名、CA、凭据来源都不同,契约不同构,所以 L4 换不了 ——
  # 必须由 L7 网关改写(§4.4、§9.2)。渲染时这条会被显式跳过。
  - id: llm-3p:qwen3-32b@openai-v1
    output_contract: OpenAI v1 chat/completions,供应商声明兼容
    carrier: l7_gateway
    observation_point: l7_gateway
    price_source: 供应商合同导入
    members:
      - address: https://api.example.net/v1
        provider: 供应商A
        egress_credential_ref: "vault:llm3p/a"
        access_contract: {domain: api.example.net, cert_ca: public-webpki, credential: "vault:llm3p/a", path_prefix: /v1, protocol_ver: http/1.1}
      - address: https://api.example.org/openai/v1
        provider: 供应商B
        egress_credential_ref: "vault:llm3p/b"
        access_contract: {domain: api.example.org, cert_ca: public-webpki, credential: "vault:llm3p/b", path_prefix: /openai/v1, protocol_ver: h2}

declarations:
  # 地址随请求走 + 出口钉死。典型用途是账号绑定了固定出口 IP(§4.1)。
  # 出口是 sg-vps,但它拨不到 —— 所以链必然是 [国内云机, sg-vps],两跳。
  - id: sg-fixed
    name: 固定新加坡出口
    address_axis: from_request
    egress_axis: pinned:sg-vps
    objective: stability
    probe_url: https://api.ipify.org
    allowed_servers: [cn-bj, cn-sh, cn-gz, cn-cd, sg-vps]
    max_hops: 2
    tuning_period: 10m
    switch_threshold: 0.2
    # window 必须装得下 min_samples 个样本:主动探测一个 tuning_period 才出
    # 一个样本,window/tuning_period < min_samples 时排序永远不会启动。
    window: 2h
    min_samples: 6
    stale_after: 30m

  # 地址随请求走 + 出口任选。普通代理上网,让调度挑最快的出口。
  - id: best-egress
    name: 最优出口
    address_axis: from_request
    egress_axis: any
    objective: latency
    probe_url: https://api.ipify.org
    allowed_servers: [cn-bj, cn-gz, sg-vps, jp-vps]
    max_hops: 2
    tuning_period: 5m
    switch_threshold: 0.2
    # window 必须装得下 min_samples 个样本:主动探测一个 tuning_period 才出
    # 一个样本,window/tuning_period < min_samples 时排序永远不会启动。
    window: 1h
    min_samples: 6
    stale_after: 20m

  # 地址从等价类里选 + 出口任选。带合规约束,因此 fallback 必须是
  # fail_closed —— 候选集为空时任何自动回退都等于绕过约束(§5.8)。
  - id: llm-ttft
    name: 推理端点按首字延迟调度
    address_axis: class:llm:qwen3-32b-int8@openai-v1
    egress_axis: any
    objective: ttft
    probe_url: https://api.ipify.org
    constraints:
      - {kind: compliance, expr: 数据不出境}
      - {kind: sla, expr: p95 < 200ms}
    allowed_servers: [cn-bj, cn-sh]
    max_hops: 1
    top_n: 2
    ranking_period: 1h
    tuning_period: 10m
    switch_threshold: 0.15
    # window 必须装得下 min_samples 个样本:主动探测一个 tuning_period 才出
    # 一个样本,window/tuning_period < min_samples 时排序永远不会启动。
    window: 3h
    min_samples: 12
    stale_after: 30m
    fallback: fail_closed

  # 第三方 API 调度。carrier 是 l7_gateway,数据平面没有候选 —— 渲染时
  # 会被显式跳过,并说明它需要网关承载。
  - id: llm-3p
    name: 第三方推理端点调度
    address_axis: class:llm-3p:qwen3-32b@openai-v1
    egress_axis: any
    objective: cost
    probe_url: https://api.ipify.org
    allowed_servers: [cn-bj]
    max_hops: 1
    top_n: 2
    ranking_period: 1h
    tuning_period: 10m
    switch_threshold: 0.15

credentials:
  - {id: cred-phone, owner: 手机,  declaration: sg-fixed,    secret_ref: "vault:cred/phone"}
  - {id: cred-ws-sg, owner: 工作站, declaration: sg-fixed,    secret_ref: "vault:cred/ws-sg"}
  - {id: cred-ws-eg, owner: 工作站, declaration: best-egress, secret_ref: "vault:cred/ws-eg"}
  - {id: cred-ws-llm, owner: 工作站, declaration: llm-ttft,   secret_ref: "vault:cred/ws-llm"}
  - {id: cred-ws-3p, owner: 工作站, declaration: llm-3p,      secret_ref: "vault:cred/ws-3p"}
  - {id: cred-ci,    owner: CI,    declaration: best-egress, secret_ref: "vault:cred/ci"}
